name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldest, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'oldest' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      # End to end on gotia itself: record a map, then select from it.
      - name: smoke
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/gotia" .
          "$RUNNER_TEMP/gotia" test -list
          "$RUNNER_TEMP/gotia" record
          "$RUNNER_TEMP/gotia" why TestPlan
          "$RUNNER_TEMP/gotia" test plan.go
